<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lona Library – College Library Management</title>
    <meta name="description" content="Lona Library – A modern library management system for college students and administrators.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

        <div class="login-cards">

            <a href="login.html?role=user" class="login-card" id="user-login-card">

                <div class="login-card-arrow">→</div>

        </div>

            <p>© 2024 Lona Library • All Rights Reserved</p>

        <span></span><span></span><span></span>
